<!DOCTYPE html>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            outline: none;
            border-color: #4b41e1;
            box-shadow: 0 0 0 3px rgba(75, 65, 225, 0.2);
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-md">
<!-- Sidebar (Suppressed for focused modal task but showing structural placement for context) -->
<!-- The user requested a focused modal/centered card layout for a specific task. -->
<main class="w-full max-w-lg">
<!-- Overlay backdrop simulation -->
<div class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-0"></div>
<!-- Edit Resume Metadata Card -->
<div class="relative z-10 bg-surface-container-lowest border border-outline-variant shadow-xl rounded-xl overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface-container-low/50">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Edit Resume Metadata</h1>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<form action="#" class="p-lg space-y-xl" method="POST">
<!-- Field: Candidate ID -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs" for="candidate-id">
                        CANDIDATE ID
                        <span class="material-symbols-outlined text-[14px]">fingerprint</span>
</label>
<div class="relative">
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-code-id text-code-id form-input-focus transition-all" id="candidate-id" name="candidate_id" placeholder="Enter ID..." type="text" value="#CAND-8942"/>
</div>
</div>
<!-- Field: Parser Version -->
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs" for="parser-version">
                        PARSER VERSION
                        <span class="material-symbols-outlined text-[14px]">schema</span>
</label>
<div class="relative">
<select class="w-full appearance-none px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface-variant cursor-not-allowed opacity-80" disabled="" id="parser-version" name="parser_version">
<option selected="">v2.4.1</option>
<option>v2.4.0</option>
<option>v2.3.9 (Legacy)</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-md pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">lock</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/70 italic">System-locked for consistency.</p>
</div>
<!-- Helper Note with AI Sparkle -->
<div class="p-md bg-secondary-fixed/30 border border-secondary-fixed-dim rounded-lg flex gap-md items-start">
<span class="material-symbols-outlined text-secondary mt-1" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-sm text-body-sm text-on-tertiary-fixed-variant leading-relaxed">
<span class="font-bold text-secondary">Note:</span> Changing metadata does not trigger a re-parse of the CV content. To update extracted skills or contact info, please trigger a <span class="underline cursor-pointer">Manual Re-parse</span>.
                    </p>
</div>
<!-- Action Buttons -->
<div class="flex justify-end items-center gap-md pt-md">
<button class="px-lg py-sm font-label-caps text-label-caps text-on-surface-variant border border-transparent hover:bg-surface-container-high rounded-lg transition-all" type="button">
                        Cancel
                    </button>
<button class="px-lg py-sm font-label-caps text-label-caps bg-secondary text-on-secondary rounded-lg hover:bg-secondary-container shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center gap-sm" type="submit">
<span>Save changes</span>
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</form>
<!-- Decorative Visual Token -->
<div class="h-1 w-full bg-gradient-to-r from-secondary/40 via-secondary to-secondary/40"></div>
</div>
<!-- Background Atmospheric Element -->
<div class="fixed top-12 left-1/4 -z-10 opacity-20 pointer-events-none">
<div class="w-64 h-64 bg-secondary rounded-full blur-[100px]"></div>
</div>
<div class="fixed bottom-12 right-1/4 -z-10 opacity-20 pointer-events-none">
<div class="w-96 h-96 bg-primary rounded-full blur-[120px]"></div>
</div>
</main>
<script>
        // Simple micro-interaction for the submit button
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `
                <span class="animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
                <span>Saving...</span>
            `;
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined text-[18px]">task_alt</span>
                    <span>Saved</span>
                `;
                btn.classList.replace('bg-secondary', 'bg-green-600');
                
                setTimeout(() => {
                    // Simulation of closing
                    document.querySelector('.animate-in').classList.add('animate-out', 'fade-out', 'zoom-out');
                    setTimeout(() => {
                        window.location.reload();
                    }, 300);
                }, 1000);
            }, 1200);
        });
    </script>
</body></html>
